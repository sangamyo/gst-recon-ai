# Local full stack: API + Celery worker + Redis + Postgres (+ Vite dev server).
#   docker compose up --build
# API: http://localhost:8000/docs   Frontend: http://localhost:5173
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gstrecon
      POSTGRES_PASSWORD: gstrecon
      POSTGRES_DB: gstrecon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gstrecon -d gstrecon"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment: &backend-env
      ENV: development
      GSTRECON_SECRET_KEY: ${GSTRECON_SECRET_KEY:-local-dev-only-secret-change-me}
      DATABASE_URL: postgresql://gstrecon:gstrecon@postgres:5432/gstrecon
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      STORAGE_DIR: /app/storage
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.celery_app.celery_app worker -Q reconciliation --loglevel=info
    environment: *backend-env
    # Shares the storage volume so the worker can read uploads and write reports.
    volumes:
      - storage:/app/storage
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  pgdata:
  storage:
  frontend_node_modules:
