# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy: https://render.com/deploy?repo=https://github.com/sangamyo/gst-recon-ai
services:
  - type: web
    name: hok-gst-recon-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./GSTReconAI/backend
    dockerfilePath: ./GSTReconAI/backend/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: GSTRECON_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hok-gst-recon-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://gst-recon-ai.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: ^https://gst-recon-ai(-[a-z0-9-]+)?\.vercel\.app$

databases:
  - name: hok-gst-recon-db
    plan: free
    region: singapore
    databaseName: gstrecon
    user: gstrecon
